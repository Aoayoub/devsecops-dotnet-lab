
name: DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # 1. Build, tests and initial security checks
  build-test-security:
    name: Build, Test & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection - Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DevSecOpsLab.slnx --locked-mode

      - name: Build
        run: dotnet build DevSecOpsLab.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DevSecOpsLab.slnx --configuration Release --no-build

      - name: Security - Vulnerable dependencies
        run: dotnet list DevSecOpsLab.slnx package --vulnerable --include-transitive


  # 2. SonarQube Code Quality and Security Analysis
  sonarqube-analysis:
    name: Code Quality - SonarQube
    needs: build-test-security

    # Requires a self-hosted Windows runner on your PC
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install SonarScanner
        shell: powershell
        run: |
          dotnet tool install dotnet-sonarscanner --tool-path "$env:RUNNER_TEMP\sonar-scanner"

      - name: SonarQube Begin
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $scanner = "$env:RUNNER_TEMP\sonar-scanner\dotnet-sonarscanner.exe"

          & $scanner begin /k:"devsecops-dotnet-lab" `
            /d:sonar.host.url="$env:SONAR_HOST_URL" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.qualitygate.wait=true `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Restore
        run: dotnet restore DevSecOpsLab.slnx --locked-mode

      - name: Build
        run: dotnet build DevSecOpsLab.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test DevSecOps.Api.Tests/DevSecOps.Api.Tests.csproj `
            --configuration Release `
            --no-build `
            --collect:"XPlat Code Coverage" `
            --results-directory ./TestResults `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Verify OpenCover report
        shell: powershell
        run: |
          $report = Get-ChildItem -Path "./TestResults" -Filter "coverage.opencover.xml" -Recurse -ErrorAction SilentlyContinue

          if (-not $report) {
            Write-Error "OpenCover report not found!"
            exit 1
          }

          Write-Host "OpenCover report found:"
          $report | ForEach-Object { Write-Host $_.FullName }

      - name: SonarQube End
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $scanner = "$env:RUNNER_TEMP\sonar-scanner\dotnet-sonarscanner.exe"
          & $scanner end /d:sonar.token="$env:SONAR_TOKEN"


  # 3. Software Composition Analysis - OSV Scanner
  osv-scan:
    name: SCA - OSV Scanner
    needs: build-test-security

    permissions:
      actions: read
      contents: read
      security-events: write

    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1

    with:
      scan-args: |-
        --lockfile=./DevSecOps.Api/packages.lock.json
        --lockfile=./DevSecOps.Api.Tests/packages.lock.json
      fail-on-vuln: true


  # 4. Vulnerability and Misconfiguration Scan - Trivy
  trivy-scan:
    name: Vulnerability & Misconfiguration - Trivy
    needs: build-test-security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scan the repository filesystem
      - name: Trivy - Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      # Build the Docker image
      - name: Build Docker Image
        run: docker build -t devsecops-api:latest -f Dockerfile .

      # Scan the Docker image
      - name: Trivy - Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "devsecops-api:latest"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true


  # 5. Dynamic Application Security Testing - OWASP ZAP
  zap-scan:
    name: DAST - OWASP ZAP
    needs: build-test-security
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DevSecOpsLab.slnx --locked-mode

      - name: Build
        run: dotnet build DevSecOps.Api/DevSecOps.Api.csproj --configuration Release

      - name: Start API
        run: |
          dotnet run --project DevSecOps.Api/DevSecOps.Api.csproj \
            --configuration Release \
            --no-build \
            --urls http://0.0.0.0:8080 &
          echo $! > api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start"
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          artifact_name: "zap-scan-report"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"


  # 6. Publish Docker image to GitHub Container Registry
  publish-image:
    name: Publish Docker Image
    needs:
      - build-test-security
      - sonarqube-analysis
      - osv-scan
      - trivy-scan
      - zap-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/aoayoub/devsecops-api:latest
