
name: DevSecOps CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Secret Detection - Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DevSecOpsLab.slnx --locked-mode

      - name: Build
        run: dotnet build DevSecOpsLab.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DevSecOpsLab.slnx --configuration Release --no-build

      - name: Security - Vulnerable dependencies
        run: dotnet list DevSecOpsLab.slnx package --vulnerable --include-transitive
      - name: Docker Build
        run: |
          docker build \
            -t devsecops-api:${{ github.sha }} \
            -f DevSecOps.Api/Dockerfile \
            DevSecOps.Api

      # 9. Export de l'image Docker
      - name: Export Docker Image
        run: |
          docker save \
            devsecops-api:${{ github.sha }} \
            -o devsecops-api.tar

      # 10. Analyse de l'image avec Trivy
      - name: Trivy - Image Vulnerability Scan
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            aquasec/trivy:0.70.0 image \
            --input /work/devsecops-api.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 
    

 
  osv-scan:
    name: SCA - OSV Scanner
    needs: build-test-security
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=./DevSecOps.Api/packages.lock.json
        --lockfile=./DevSecOps.Api.Tests/packages.lock.json
      fail-on-vuln: true 